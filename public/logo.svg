<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b3e"/>
      <stop offset="100%" style="stop-color:#0f1729"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="60%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>
  <!-- Subtle glow rings -->
  <circle cx="256" cy="256" r="175" fill="#1e3a8a" opacity="0.30"/>
  <circle cx="256" cy="256" r="110" fill="#1d4ed8" opacity="0.12"/>
  <!-- C arc: open at top-right, thick stroke -->
  <path d="M 378 150 A 155 155 0 1 0 378 362"
    fill="none" stroke="url(#arcGrad)" stroke-width="54" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow tip at top end (cyan chevron rotated to point up-right) -->
  <g transform="translate(378,150) rotate(-52)">
    <polygon points="0,-34 24,20 0,8 -24,20" fill="#06b6d4"/>
  </g>
  <!-- White upward rocket/triangle in center -->
  <polygon transform="translate(256,256)" points="0,-55 38,34 0,18 -38,34" fill="white" opacity="0.93"/>
</svg>
